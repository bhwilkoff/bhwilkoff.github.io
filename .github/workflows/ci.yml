name: CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'tweet-archive-app/package-lock.json'

      - name: Install dependencies
        working-directory: ./tweet-archive-app
        run: npm ci

      - name: Lint
        working-directory: ./tweet-archive-app
        run: npm run lint

      - name: Convert tweet data
        working-directory: ./tweet-archive-app
        run: npm run convert

      - name: Build
        working-directory: ./tweet-archive-app
        run: npm run build
